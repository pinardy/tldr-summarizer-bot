<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLDR Digest Archive</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8862e">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // Apply the theme before first paint to avoid a flash of the wrong mode.
  // Stored preference wins; otherwise follow the OS setting.
  (function () {
    let stored = null;
    try { stored = localStorage.getItem("theme"); } catch {}
    const theme = stored ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f4efe4;
    --card: #fdfaf2;
    --ink: #2b2118;
    --muted: #7a6a55;
    --accent: #e8862e;
    --rule: #d8cdb8;
    --blurb: #4a3d2e;
    --banner-dim: none;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1e1a14;
    --card: #2a241c;
    --ink: #ece4d4;
    --muted: #a4937a;
    --rule: #453b2d;
    --blurb: #cfc4b0;
    --banner-dim: brightness(0.85);
  }
  /* No-JS fallback: follow the OS when the early script never ran. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      color-scheme: dark;
      --paper: #1e1a14;
      --card: #2a241c;
      --ink: #ece4d4;
      --muted: #a4937a;
      --rule: #453b2d;
      --blurb: #cfc4b0;
      --banner-dim: brightness(0.85);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  /* Compact masthead: the news should start near the top of the first screen,
     so the banner is a capped strip rather than a full-height image. */
  header { max-width: 900px; margin: 0 auto; padding: 16px 16px 0; text-align: center; position: relative; }
  header img {
    width: 100%; max-height: 110px; object-fit: cover; object-position: center 35%;
    border-radius: 10px; border: 1px solid var(--rule); filter: var(--banner-dim);
  }
  /* Inside the header (over the banner corner) so it scrolls away with it
     instead of floating over article text. */
  #theme-toggle {
    position: absolute; top: 26px; right: 26px;
    width: 40px; height: 40px; font-size: 1.1rem; line-height: 1;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 50%;
    cursor: pointer;
  }
  #theme-toggle:hover { border-color: var(--accent); }
  h1 { font-size: 1.4rem; margin: 10px 0 0; }
  .subtitle { color: var(--muted); font-style: italic; margin: 0 0 12px; font-size: 0.9rem; }
  .layout {
    max-width: 900px; margin: 0 auto; padding: 0 16px 48px;
    display: grid; grid-template-columns: 170px 1fr; gap: 24px;
  }
  /* Mobile: single column with the news first — dates move below the digest. */
  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    .layout nav { order: 2; }
    .layout main { order: 1; }
  }
  /* Desktop: keep the date nav in view while scrolling the digest. */
  @media (min-width: 641px) {
    .layout nav { position: sticky; top: 16px; align-self: start; }
  }
  nav h2, main h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
  nav ul { list-style: none; padding: 0; margin: 0; }
  #dates { max-height: 70vh; overflow-y: auto; }
  /* On mobile the dates list sits at the page bottom; give it full height
     instead of a nested scrollbar. (Must come after the base #dates rule.) */
  @media (max-width: 640px) {
    #dates { max-height: none; overflow-y: visible; }
  }
  nav summary {
    cursor: pointer; padding: 10px 8px; font-weight: bold;
    font-variant-numeric: tabular-nums; user-select: none;
  }
  nav summary:hover { background: var(--card); }
  nav details ul { padding-left: 10px; }
  nav a {
    display: block; padding: 10px 8px; color: var(--ink); text-decoration: none;
    border-left: 3px solid transparent; font-variant-numeric: tabular-nums;
  }
  nav a:hover { background: var(--card); }
  nav a.active { border-left-color: var(--accent); background: var(--card); font-weight: bold; }
  /* Prev/next day switcher next to the heading — switch days without
     scrolling to the dates list. */
  .day-nav { display: flex; align-items: center; gap: 8px; }
  .day-nav h2 { flex: 1; margin: 0; }
  .day-nav button {
    font: inherit; font-size: 1.15rem; line-height: 1;
    min-width: 44px; min-height: 40px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 8px;
    cursor: pointer;
  }
  .day-nav button:hover:not(:disabled) { border-color: var(--accent); }
  .day-nav button:disabled { opacity: 0.35; cursor: default; }
  /* Newsletter cards are collapsible; on fallback days they start closed so
     the page opens as a short list instead of ~100 stories. */
  details.digest {
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 16px 24px; margin-bottom: 16px;
    /* Breathing room when a card is scrolled to the viewport top on expand. */
    scroll-margin-top: 8px;
  }
  details.digest > summary { cursor: pointer; list-style: none; }
  details.digest > summary::-webkit-details-marker { display: none; }
  details.digest > summary::before { content: "▸ "; color: var(--accent); font-size: 0.9em; }
  details.digest[open] > summary::before { content: "▾ "; }
  details.digest > summary h3 { display: inline; margin: 0; font-size: 1.2rem; }
  details.digest > summary .count { color: var(--muted); font-size: 0.85rem; margin-left: 8px; white-space: nowrap; }
  .tagline { color: var(--muted); font-style: italic; margin: 6px 0 14px; }
  .section-name {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--accent); border-bottom: 1px solid var(--rule);
    padding-bottom: 3px; margin: 18px 0 10px;
  }
  /* Stories are <details>: the chevron signals tap-to-expand and the summary
     is keyboard-focusable for free. */
  details.story { margin: 0 0 10px; }
  details.story > summary { cursor: pointer; list-style: none; }
  details.story > summary::-webkit-details-marker { display: none; }
  details.story > summary::before {
    content: "▸"; color: var(--muted); font-size: 0.75em;
    /* A padded chevron is an easier expand target next to the headline link. */
    padding: 4px 10px 4px 2px; margin-right: 1px;
  }
  details.story[open] > summary::before { content: "▾"; }
  .story a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--accent); }
  .story a:hover { color: var(--accent); }
  .story .headline { font-weight: bold; }
  .story .blurb { margin: 2px 0 0 18px; color: var(--blurb); font-size: 0.95rem; }
  .controls { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  .controls .meta { flex: 1; margin: 0; }
  #blurb-toggle {
    font: inherit; font-size: 0.8rem; white-space: nowrap;
    background: var(--card); color: var(--muted);
    border: 1px solid var(--rule); border-radius: 6px;
    padding: 3px 10px; cursor: pointer;
  }
  #blurb-toggle:hover { border-color: var(--accent); color: var(--ink); }
  /* Mobile: an expanded card can be ~100 stories long, so closing it again
     shouldn't require scrolling back to its heading — offer a collapse
     control at the bottom of the open card. */
  .collapse-card { display: none; }
  @media (max-width: 640px) {
    .collapse-card {
      display: block; width: 100%; margin-top: 16px;
      font: inherit; font-size: 0.85rem;
      background: none; color: var(--muted);
      border: 1px solid var(--rule); border-radius: 8px;
      padding: 8px; cursor: pointer;
    }
    .collapse-card:hover { border-color: var(--accent); color: var(--ink); }
  }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .empty { color: var(--muted); font-style: italic; padding: 40px 0; text-align: center; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding-bottom: 32px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <img src="banner.jpg" alt="TLDR digest bot">
  <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
  <h1>TLDR Digest Archive</h1>
  <p class="subtitle">Daily key points from the TLDR newsletters, by date</p>
</header>

<div class="layout">
  <nav>
    <h2>Dates</h2>
    <ul id="dates"></ul>
  </nav>
  <main>
    <div class="day-nav">
      <button id="prev-day" aria-label="Older digest" title="Older digest" disabled>‹</button>
      <h2 id="current-date">&nbsp;</h2>
      <button id="next-day" aria-label="Newer digest" title="Newer digest" disabled>›</button>
    </div>
    <div id="content"><p class="empty">Loading…</p></div>
  </main>
</div>

<footer>
  Generated by <a href="https://github.com/pinardy/tldr-summarizer-bot">tldr-summarizer-bot</a> ·
  sources: <a href="https://tldr.tech">tldr.tech</a>
</footer>

<script src="data/data.js"></script>
<script>
(async function () {
  // Fallback for file:// viewing, where fetch() of local JSON is blocked.
  const embedded = window.__DIGEST_DATA || null;
  const datesEl = document.getElementById("dates");
  const contentEl = document.getElementById("content");
  const currentDateEl = document.getElementById("current-date");
  const prevBtn = document.getElementById("prev-day");
  const nextBtn = document.getElementById("next-day");

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // cardOpen: whether the newsletter card starts expanded.
  // storiesOpen: whether story descriptions start expanded.
  function renderDigest(digest, cardOpen, storiesOpen) {
    const card = el("details", "digest");
    card.open = cardOpen;
    const cardSummary = el("summary");
    cardSummary.appendChild(el("h3", null, digest.title));
    const n = (digest.sections || []).reduce((t, s) => t + (s.stories || []).length, 0);
    cardSummary.appendChild(el("span", "count", `${n} stories`));
    // Mobile: expanding a card mid-screen leaves the reader partway into it,
    // so align the card's top with the viewport on open. The click handler
    // (rather than a toggle listener) avoids firing on the initial render,
    // and the state check runs after the default action flips `open`.
    cardSummary.addEventListener("click", () => {
      requestAnimationFrame(() => {
        if (card.open && matchMedia("(max-width: 640px)").matches) {
          card.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    });
    card.appendChild(cardSummary);
    if (digest.tagline) card.appendChild(el("p", "tagline", digest.tagline));
    for (const section of digest.sections || []) {
      if (section.name) card.appendChild(el("div", "section-name", section.name));
      for (const story of section.stories || []) {
        const storyEl = el("details", "story");
        storyEl.open = storiesOpen;
        const summary = el("summary");
        const headline = el("span", "headline");
        if (story.url) {
          const a = el("a", null, story.headline);
          a.href = story.url;
          a.target = "_blank";
          a.rel = "noopener";
          headline.appendChild(a);
        } else {
          headline.textContent = story.headline;
        }
        summary.appendChild(headline);
        storyEl.appendChild(summary);
        storyEl.appendChild(el("p", "blurb", story.blurb));
        card.appendChild(storyEl);
      }
    }
    const collapseBtn = el("button", "collapse-card", "▴ Collapse section");
    collapseBtn.addEventListener("click", () => {
      card.open = false;
      // Closing removes most of the page height; jump back to the card's
      // heading so the reader isn't left at an arbitrary scroll position.
      card.scrollIntoView({ block: "start" });
    });
    card.appendChild(collapseBtn);
    return card;
  }

  async function showDate(date, dates) {
    currentDateEl.textContent = date;
    // Prev = older day, next = newer day (the index is newest-first).
    const i = dates.indexOf(date);
    prevBtn.disabled = i < 0 || i >= dates.length - 1;
    nextBtn.disabled = i <= 0;
    prevBtn.dataset.target = prevBtn.disabled ? "" : dates[i + 1];
    nextBtn.dataset.target = nextBtn.disabled ? "" : dates[i - 1];

    contentEl.replaceChildren(el("p", "empty", "Loading…"));
    for (const a of datesEl.querySelectorAll("a")) {
      const active = a.dataset.date === date;
      a.classList.toggle("active", active);
      if (active) {
        const group = a.closest("details");
        if (group) group.open = true;
      }
    }
    try {
      let day;
      try {
        const resp = await fetch(`data/${date}.json`);
        if (!resp.ok) throw new Error(resp.status);
        day = await resp.json();
      } catch (e) {
        if (embedded && embedded.latest && embedded.latest.date === date) {
          day = embedded.latest;
        } else {
          throw e;
        }
      }
      contentEl.replaceChildren();
      // Fallback days (no AI summary) start compact: newsletter cards closed,
      // descriptions collapsed. Summarized days start fully expanded.
      const summarized = day.mode === "combined";
      const modeLabel = summarized
        ? "combined digest"
        : "full newsletters (AI summary unavailable)";
      const controls = el("div", "controls");
      controls.appendChild(
        el("p", "meta", `${modeLabel} · ${(day.categories || []).join(", ")}`)
      );
      let descriptionsShown = summarized;
      const blurbToggle = el("button", null);
      blurbToggle.id = "blurb-toggle";
      const syncBlurbToggle = () => {
        blurbToggle.textContent = descriptionsShown ? "Hide descriptions" : "Show descriptions";
        blurbToggle.setAttribute("aria-expanded", String(descriptionsShown));
      };
      blurbToggle.addEventListener("click", () => {
        descriptionsShown = !descriptionsShown;
        for (const s of contentEl.querySelectorAll("details.story")) s.open = descriptionsShown;
        syncBlurbToggle();
      });
      syncBlurbToggle();
      controls.appendChild(blurbToggle);
      contentEl.appendChild(controls);
      for (const digest of day.digests || []) {
        contentEl.appendChild(renderDigest(digest, summarized, descriptionsShown));
      }
    } catch {
      contentEl.replaceChildren(el("p", "empty", `No digest found for ${date}.`));
    }
  }

  let dates = [];
  try {
    const resp = await fetch("data/index.json");
    dates = await resp.json();
  } catch {
    if (embedded) dates = embedded.index || [];
  }

  if (!dates.length) {
    contentEl.replaceChildren(el("p", "empty", "No digests archived yet — check back after the next scheduled run."));
    return;
  }

  // Group dates by year-month; keep the current month expanded, collapse the rest.
  const now = new Date();
  const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const monthFmt = new Intl.DateTimeFormat("en", { month: "long", year: "numeric" });
  const groups = new Map();
  for (const date of dates) {
    const month = date.slice(0, 7);
    if (!groups.has(month)) groups.set(month, []);
    groups.get(month).push(date);
  }
  for (const [month, monthDates] of groups) {
    const details = document.createElement("details");
    details.open = month === currentMonth;
    details.appendChild(el("summary", null, monthFmt.format(new Date(`${month}-01T00:00:00`))));
    const ul = document.createElement("ul");
    for (const date of monthDates) {
      const li = document.createElement("li");
      const a = el("a", null, date);
      a.href = `#${date}`;
      a.dataset.date = date;
      li.appendChild(a);
      ul.appendChild(li);
    }
    details.appendChild(ul);
    const li = document.createElement("li");
    li.appendChild(details);
    datesEl.appendChild(li);
  }

  for (const btn of [prevBtn, nextBtn]) {
    btn.addEventListener("click", () => {
      if (btn.dataset.target) location.hash = `#${btn.dataset.target}`;
    });
  }

  function currentTarget() {
    const hash = location.hash.slice(1);
    return dates.includes(hash) ? hash : dates[0];
  }
  window.addEventListener("hashchange", () => showDate(currentTarget(), dates));
  await showDate(currentTarget(), dates);
})();

// Dark/light toggle: persists the choice and keeps the button icon and the
// browser-chrome color (theme-color meta) in sync with the active theme.
(function () {
  const btn = document.getElementById("theme-toggle");
  const meta = document.querySelector('meta[name="theme-color"]');
  function apply(theme) {
    document.documentElement.dataset.theme = theme;
    btn.textContent = theme === "dark" ? "☀️" : "🌙";
    btn.setAttribute("aria-pressed", theme === "dark");
    if (meta) meta.content = theme === "dark" ? "#1e1a14" : "#e8862e";
  }
  apply(document.documentElement.dataset.theme || "light");
  btn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", next); } catch {}
    apply(next);
  });
})();

// Register the service worker (PWA: installable + offline archive). Requires
// an https/localhost origin, so it's a no-op when viewed via file://.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
